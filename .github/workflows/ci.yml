name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck worker
        run: npm run check:worker

      - name: Unit and mount tests
        run: npm test

      - name: Build static site
        run: npm run build:cf
        env:
          VITE_SANITY_PROJECT_ID: etg9lezr
          VITE_SANITY_DATASET: production
          VITE_SANITY_API_READ_TOKEN: ${{ secrets.VITE_SANITY_API_READ_TOKEN }}

      - name: No Pages leftovers in dist
        run: |
          test ! -e dist/public/CNAME
          python3 -c 'from pathlib import Path; assert not (Path("dist/public") / ("4"+"04.html")).exists()'

      - name: Social preview asset present
        run: test -s dist/public/social-preview.jpg

      - name: B2 — no API key strings in client bundle
        run: |
          if grep -RInE 'DAILY_FIX_API_KEY|X-API-Key|test-secret-key' dist/public; then
            echo "B2 failed: secret strings found in dist/public" >&2
            exit 1
          fi
          echo "B2 ok: no key strings in dist/public"

      - name: Assert liquidglass stays out of App entry chunk
        run: npm run assert:liquidglass-chunk

      - name: Pool-workers HTMLRewriter tests (built dist)
        run: npm run test:workers

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
