name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A1.1 needs MAIN_BASE (9f7129d7) as a reachable ancestor for
          # `git merge-base --is-ancestor` + `git diff` against that pin.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck worker
        run: npm run check:worker

      - name: Unit and mount tests
        run: before=$(git status --porcelain --ignored --untracked-files=all); npm test; after=$(git status --porcelain --ignored --untracked-files=all); if [ "$before" != "$after" ]; then echo "V12(b) porcelain changed"; diff -u <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true; exit 1; fi

      - name: Build static site
        run: npm run build:cf
        env:
          VITE_SANITY_PROJECT_ID: etg9lezr
          VITE_SANITY_DATASET: production

      - name: No Sanity token in dist
        run: |
          test -d dist/public
          if grep -rIlE --include='*.js' --include='*.html' --include='*.css' --include='*.map' '\bsk[A-Za-z0-9]{40,}\b' dist/public; then
            exit 1
          fi
          if grep -rIlE --include='*.js' --include='*.html' --include='*.css' --include='*.map' 'VITE_SANITY_API_READ_TOKEN' dist/public; then
            exit 1
          fi

      - name: Social preview asset present
        run: test -s dist/public/social-preview.jpg

      - name: B2 — no API key strings in client bundle
        run: |
          if grep -RInE 'DAILY_FIX_API_KEY|X-API-Key|test-secret-key' dist/public; then
            echo "B2 failed: secret strings found in dist/public" >&2
            exit 1
          fi
          echo "B2 ok: no key strings in dist/public"

      - name: DP-WHOP-1 — no Curie in dist/public
        run: |
          if grep -RInE --include='*.js' --include='*.html' --include='*.css' --include='*.map' 'curie' dist/public; then
            echo "DP-WHOP-1 failed: Curie substring found in dist/public" >&2
            exit 1
          fi
          echo "DP-WHOP-1 ok: no Curie in dist/public"

      - name: DP-WHOP-1 — only Break Even biz_ literal (whop.ts) elsewhere forbidden
        run: |
          BEP='biz_u15G8d34g9c0B0'
          # Source: any biz_ outside shared/account/whop.ts (and tests) fails.
          hits=$(grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.test.ts' --exclude='*.test.tsx' -e 'biz_[A-Za-z0-9]+' client worker shared wrangler.jsonc || true)
          bad=$(printf '%s\n' "$hits" | grep -v '^shared/account/whop.ts:' | grep -v "$BEP" || true)
          # Also fail if BEP appears outside whop.ts
          bep_elsewhere=$(printf '%s\n' "$hits" | grep "$BEP" | grep -v '^shared/account/whop.ts:' || true)
          if [ -n "$bad" ] || [ -n "$bep_elsewhere" ]; then
            echo "DP-WHOP-1 failed: unexpected biz_ literals:" >&2
            printf '%s\n%s\n' "$bad" "$bep_elsewhere" >&2
            exit 1
          fi
          # Dist: any biz_ fails (BEP itself should not ship in client bundle).
          if grep -RInE --include='*.js' --include='*.html' --include='*.css' --include='*.map' -e 'biz_[A-Za-z0-9]+' dist/public; then
            echo "DP-WHOP-1 failed: biz_ found in dist/public" >&2
            exit 1
          fi
          echo "DP-WHOP-1 ok: sole biz_ literal in shared/account/whop.ts"

      - name: Assert liquidglass stays out of App entry chunk
        run: npm run assert:liquidglass-chunk

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run

  # Required check name: test-workers (AU7.6 real DO + HTMLRewriter pool).
  test-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site (HTMLRewriter pool needs dist)
        run: npm run build:cf
        env:
          VITE_SANITY_PROJECT_ID: etg9lezr
          VITE_SANITY_DATASET: production

      - name: Pool-workers tests (HTMLRewriter + SessionDO AU7.6)
        run: before=$(git status --porcelain --ignored --untracked-files=all); npm run test:workers; after=$(git status --porcelain --ignored --untracked-files=all); if [ "$before" != "$after" ]; then echo "V12(b) porcelain changed"; diff -u <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true; exit 1; fi

  # Required: Playwright visual + axe (PR F T-F-60 / LR-F16). Separate job.
  # Uses the official Playwright image matching the exact @playwright/test pin.
  test-playwright:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck client (T-F-58)
        run: npm run check

      - name: Build static site
        run: npm run build:cf
        env:
          VITE_SANITY_PROJECT_ID: etg9lezr
          VITE_SANITY_DATASET: production

      - name: Assert Playwright + axe pins (T-F-60)
        run: |
          node -e '
            const p = require("./package.json");
            for (const k of ["@playwright/test", "@axe-core/playwright", "axe-core"]) {
              const v = p.devDependencies[k];
              if (!/^\d+\.\d+\.\d+$/.test(v)) {
                console.error("T-F-60: " + k + " must be exact, got " + v);
                process.exit(1);
              }
            }
            console.log("T-F-60 ok: exact pins");
          '

      - name: Assert hide-recaptcha is tests-only (T-F-62)
        run: |
          test -f tests/visual/fixtures/hide-recaptcha.css
          if grep -RIn --include='*.css' --include='*.tsx' --include='*.ts' 'grecaptcha-badge' client/; then
            echo "T-F-62 failed: grecaptcha-badge hide must not live in client/" >&2
            exit 1
          fi
          echo "T-F-62 ok"

      - name: Assert no Playwright snapshot-update flags (T-F-68 / FS-2)
        run: |
          node tests/ci/checkUpdateSnapshots.mjs --self-test
          node tests/ci/checkUpdateSnapshots.mjs
          if ! grep -q 'updateSnapshots: process.env.CI ? "none"' playwright.config.ts; then
            echo "T-F-68: playwright.config.ts must set updateSnapshots none under CI" >&2
            exit 1
          fi
          echo "T-F-68 ok: updateSnapshots gated none under CI"

      - name: Assert VISUAL_HOOK_PATTERN scope (T-F-65 / ER-1)
        run: node tests/ci/scanVisualHooks.mjs

      - name: Playwright a11y + visual
        run: npx playwright test
        env:
          CI: true
